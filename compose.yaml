services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-gymback}
      POSTGRES_USER: ${DB_USER:-gymback}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gymback} -d ${DB_NAME:-gymback}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-gymback}
      DB_USER: ${DB_USER:-gymback}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      schema_db: ${schema_db:-test}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
volumes:
  pgdata:
