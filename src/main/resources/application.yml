spring:
  application:
    name: gym-back
  profiles:
    # En local se usa "local" (Tomcat embebido + JDBC). En WildFly: -Dspring.profiles.active=wildfly
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${schema_db:${SCHEMA_DB:test}}
        jdbc:
          time_zone: UTC
  liquibase:
    # Elegir solo un migrador por despliegue; en local Liquibase es el predeterminado.
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog-master.yaml
    default-schema: ${schema_db:${SCHEMA_DB:test}}
    parameters:
      schema_db: ${schema_db:${SCHEMA_DB:test}}
  flyway:
    # Para Flyway: LOCAL_FLYWAY_ENABLED=true y LIQUIBASE_ENABLED=false.
    enabled: false
    locations: classpath:db/migration
    # Solo para bases previamente inicializadas sin flyway_schema_history:
    # habilitar de forma explícita tras revisar el baseline real.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    default-schema: ${schema_db:${SCHEMA_DB:test}}
    schemas: ${schema_db:${SCHEMA_DB:test}}
    create-schemas: true
    placeholders:
      schema_db: ${schema_db:${SCHEMA_DB:test}}
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  public-site-base-url: ${PUBLIC_SITE_BASE_URL:http://localhost:5173}
  user-api-enabled: ${USER_API_ENABLED:false}
  checkin:
    # Subclaves separadas por propósito; para producción configurar dos secretos independientes.
    member-qr-secret: ${CHECKIN_MEMBER_QR_SECRET:${JWT_SECRET:}}
    kiosk-csrf-secret: ${KIOSK_CSRF_SECRET:${JWT_SECRET:}}
    cookie-secure: ${KIOSK_COOKIE_SECURE:true}

  files:
    root: ${GMS_FILES_ROOT:/var/lib/gms/files}