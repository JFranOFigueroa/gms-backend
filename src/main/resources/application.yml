spring:
  application:
    name: gym-back
  profiles:
    # En local se usa "local" (Tomcat embebido + JDBC). En WildFly: -Dspring.profiles.active=wildfly
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${schema_db:${SCHEMA_DB:test}}
        jdbc:
          time_zone: UTC
  flyway:
    # La base de datos se gestiona con Liquibase. Flyway solo se habilita en el test de integración.
    enabled: false
    baseline-on-migrate: false
    default-schema: ${schema_db:${SCHEMA_DB:test}}
    schemas: ${schema_db:${SCHEMA_DB:test}}
    create-schemas: true
    placeholders:
      schema_db: ${schema_db:${SCHEMA_DB:test}}
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  public-site-base-url: ${PUBLIC_SITE_BASE_URL:http://localhost:5173}
  user-api-enabled: ${USER_API_ENABLED:false}
  checkin:
    # Subclaves separadas por propósito; para producción configurar dos secretos independientes.
    member-qr-secret: ${CHECKIN_MEMBER_QR_SECRET:${JWT_SECRET:}}
    kiosk-csrf-secret: ${KIOSK_CSRF_SECRET:${JWT_SECRET:}}
    cookie-secure: ${KIOSK_COOKIE_SECURE:true}

  files:
    root: ${GMS_FILES_ROOT:/var/lib/gms/files}