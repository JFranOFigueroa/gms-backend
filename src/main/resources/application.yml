spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  application:
    name: gym-back
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gymback}
    username: ${DB_USER:gymback}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET search_path TO ${schema_db:${SCHEMA_DB:test}}, public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${schema_db:${SCHEMA_DB:test}}
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    default-schema: ${schema_db:${SCHEMA_DB:test}}
    schemas: ${schema_db:${SCHEMA_DB:test}}
    create-schemas: true
    placeholders:
      schema_db: ${schema_db:${SCHEMA_DB:test}}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  public-site-base-url: ${PUBLIC_SITE_BASE_URL:http://localhost:5173}
  user-api-enabled: ${USER_API_ENABLED:false}

  files:
    root: ${GMS_FILES_ROOT:/var/lib/gms/files}
